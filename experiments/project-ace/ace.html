<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Project Ace | Local Test Center</title><link rel="stylesheet" href="/ace.css"><script defer src="/ace.js"></script></head><body><main><header><span class="eyebrow">TENNIS LEGACY / LOCAL LAB</span><h1>Project Ace</h1><p>Private experimental match center • no career effects</p></header><section id="login"><h2>Local account</h2><p>Use isolated test credentials, never your production password.</p><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Local password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><p id="notice" role="status" aria-live="polite"></p><div id="pilot" hidden><div class="toolbar"><span id="session"></span><button id="logout" class="secondary">Sign out</button></div><section id="setup" hidden><h2>Schedule private match</h2><form id="schedule"><label>Start in (seconds)<input id="delay" type="number" min="5" max="86400" value="15" required></label><label>Opponent<select id="opponent"><option value="ai">AI opponent</option><option value="human">Synthetic human peer (if enabled)</option></select></label><label>Coaching<select id="mode"><option value="hybrid">Hybrid</option><option value="manual">Manual</option><option value="auto">Automatic</option></select></label><button>Schedule match</button></form></section><section id="match" hidden><div class="toolbar"><h2 id="status"></h2><span id="start"></span></div><div id="score"></div><div id="conditions" class="two"></div><div id="statistics" class="two"></div><form id="coach"><h2>Coaching instructions</h2><div id="fields" class="fields"></div><p id="current"></p><button id="send">Send next-game instructions</button></form><h2>Match events</h2><ol id="events"></ol></section></div></main></body></html>
