name: Temp Referral Build
on:
  push:
    paths:
      - 'src/**'
      - 'supabase/migrations/20260915132704_referral_program_core_v1.sql'
      - '.github/workflows/temp-referral-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
