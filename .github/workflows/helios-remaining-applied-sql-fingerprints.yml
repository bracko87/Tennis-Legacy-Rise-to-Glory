name: Helios remaining applied SQL fingerprint comparison

on:
  pull_request:
    paths:
      - 'tests/recovered-migrations/remaining-applied-fingerprints-*.json'
      - 'tests/recovered-migrations/known-applied-sql-divergences.json'
      - 'docs/HELIOS_H08_REMAINING_APPLIED_MIGRATION_DIFFERENCES.md'
      - 'scripts/helios-verify-remaining-applied-fingerprints.mjs'
      - 'supabase/migrations/**'
      - '.github/workflows/helios-remaining-applied-sql-fingerprints.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-renamed-applied-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify 202 matching fingerprints and nine unchanged REVIEW_REQUIRED replay blockers
        run: node scripts/helios-verify-remaining-applied-fingerprints.mjs
