name: Temporary avatar request UI verifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tlg_avatar_request_ui_temp.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Replace legacy mailto avatar request
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/pages/manager/ManagerPages.tsx')
          text = path.read_text()

          text = text.replace('  Camera,\n', '', 1)
          anchor = "import GameLayout from '../../components/layout/GameLayout'\n"
          if "AvatarReplacementRequestPanel" not in text:
              text = text.replace(anchor, anchor + "import AvatarReplacementRequestPanel from '../../components/player/AvatarReplacementRequestPanel'\n", 1)

          text = text.replace("  const [avatarReason, setAvatarReason] = useState('')\n  const [avatarMessage, setAvatarMessage] = useState('')\n", '', 1)

          text, count = re.subn(
              r"\n  function requestAvatarReplacement\(event: React\.FormEvent<HTMLFormElement>\) \{.*?\n  \}\n\n(?=  async function sendPasswordChangeEmail)",
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Expected one legacy requestAvatarReplacement function, found {count}')

          pattern = re.compile(
              r'''\n        <section className="tlg-account-section">\n          <header className="tlg-account-section-head tlg-account-section-head-icon">\n            <div>\n              <span>Player image</span>\n              <h3>Avatar replacement request</h3>.*?\n        </section>\n(?=\n        <section className="tlg-account-section">\n          <header className="tlg-account-section-head tlg-account-section-head-icon">\n            <div>\n              <span>Security</span>)''',
              re.S,
          )
          text, count = pattern.subn('\n        <AvatarReplacementRequestPanel />\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one legacy avatar request section, found {count}')

          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "bracko87"
          git config user.email "aleksandarlevnajic@gmail.com"
          git add src/pages/manager/ManagerPages.tsx src/components/player/AvatarReplacementRequestPanel.tsx src/styles/avatar-replacement-request.css
          git rm .github/workflows/tlg_avatar_request_ui_temp.yml
          git commit -m "Implement private avatar replacement request workflow"
          git push origin main
