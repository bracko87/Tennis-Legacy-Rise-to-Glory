name: Validate Portuguese localization

# The release validation workflow runs this check on each release.
# Keep this specialist workflow for explicit troubleshooting only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-portuguese-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Portuguese key and placeholder parity
        run: npm run check:pt
      - name: Validate production bundle
        run: npm run build
