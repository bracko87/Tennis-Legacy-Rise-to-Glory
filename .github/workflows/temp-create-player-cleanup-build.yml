name: Temp Create Player Cleanup Build
on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/temp-create-player-cleanup-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
