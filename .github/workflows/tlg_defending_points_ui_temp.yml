name: Temporary defending points UI implementation

on:
  push:
    paths:
      - '.github/workflows/tlg_defending_points_ui_temp.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Mount defending points panel
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/dashboard/TournamentV3.tsx')
          text = path.read_text()

          old_import = "import GameLayout from '../../components/layout/GameLayout'\n"
          new_import = old_import + "import TournamentDefendingPoints from '../../components/tournament/TournamentDefendingPoints'\n"
          if text.count(old_import) != 1:
              raise SystemExit('GameLayout import anchor not unique')
          text = text.replace(old_import, new_import, 1)

          old_mount = '''        </section>\n\n        <section className="tlg-detail-panel">\n          <header className="tlg-detail-panel-head">\n            <div>\n              <span>Tournament schedule</span>\n              <h2>Competition window</h2>\n            </div>\n'''
          new_mount = '''        </section>\n\n        <TournamentDefendingPoints competitionId={competitionId} rewardRows={liveRewardRows} />\n\n        <section className="tlg-detail-panel">\n          <header className="tlg-detail-panel-head">\n            <div>\n              <span>Tournament schedule</span>\n              <h2>Competition window</h2>\n            </div>\n'''
          if text.count(old_mount) != 1:
              raise SystemExit(f'Tournament schedule mount anchor count: {text.count(old_mount)}')
          text = text.replace(old_mount, new_mount, 1)

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified implementation and remove temporary workflow
        run: |
          git config user.name "bracko87"
          git config user.email "aleksandarlevnajic@gmail.com"
          git rm .github/workflows/tlg_defending_points_ui_temp.yml
          git add src/pages/dashboard/TournamentV3.tsx
          git commit -m "Mount tournament defending points UI"
          git push origin main
