name: Apply equipment modal scroll fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-equipment-modal-scroll-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply scroll lock fix
        run: python .github/scripts/fix_equipment_modal_scroll.py
      - name: Verify direct overflow bookkeeping was removed
        run: |
          ! grep -n "document.body.style.overflow" src/pages/dashboard/Equipment.tsx
          ! grep -n "document.body.style.overflow" src/components/common/GameConfirmDialog.tsx
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit fixed UI
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/bodyScrollLock.ts src/pages/dashboard/Equipment.tsx src/components/common/GameConfirmDialog.tsx src/components/equipment/EquipmentMatchSetupsEnhancement.tsx
          git diff --cached --check
          git commit -m "Fix equipment modal scroll locking"
          git push origin main
