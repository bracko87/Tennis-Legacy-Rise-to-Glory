name: Health Phase 2 Build Check
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/pages/dashboard/Injuries.tsx'
      - 'src/styles/health-system.css'
      - '.github/workflows/health-phase2-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
