name: Temporary tournament scroll fix verifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tlg_tournament_scroll_fix_temp.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch tournament scroll and defending points icon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          app = 'src/App.tsx'
          old_reset = '''function resetTournamentScrollPosition() {
  window.scrollTo(0, 0)

  if (document.scrollingElement) {
    document.scrollingElement.scrollTop = 0
    document.scrollingElement.scrollLeft = 0
  }

  const tournamentPage = document.querySelector<HTMLElement>('.tlg-detail-page')
  let parent = tournamentPage?.parentElement ?? null

  while (parent) {
    const overflowY = window.getComputedStyle(parent).overflowY
    if (overflowY === 'auto' || overflowY === 'scroll' || overflowY === 'overlay') {
      parent.scrollTop = 0
      parent.scrollLeft = 0
    }
    parent = parent.parentElement
  }
}
'''
          new_reset = '''function resetTournamentScrollPosition() {
  window.scrollTo({ top: 0, left: 0, behavior: 'auto' })

  if (document.scrollingElement) {
    document.scrollingElement.scrollTop = 0
    document.scrollingElement.scrollLeft = 0
  }

  const tournamentPage = document.querySelector<HTMLElement>('.tlg-detail-page')
  if (!tournamentPage) return false

  let parent = tournamentPage.parentElement
  while (parent) {
    const overflowY = window.getComputedStyle(parent).overflowY
    if (overflowY === 'auto' || overflowY === 'scroll' || overflowY === 'overlay') {
      parent.scrollTop = 0
      parent.scrollLeft = 0
    }
    parent = parent.parentElement
  }

  tournamentPage.scrollIntoView({ block: 'start', inline: 'nearest', behavior: 'auto' })
  window.scrollTo({ top: 0, left: 0, behavior: 'auto' })
  return true
}
'''
          replace_once(app, old_reset, new_reset)

          old_effect = '''  useLayoutEffect(() => {
    resetTournamentScrollPosition()
    const frame = window.requestAnimationFrame(resetTournamentScrollPosition)
    return () => window.cancelAnimationFrame(frame)
  }, [competitionId])
'''
          new_effect = '''  useLayoutEffect(() => {
    let cancelled = false
    let frame = 0
    let attempts = 0

    const resetWhenMounted = () => {
      if (cancelled) return
      attempts += 1
      const pageIsMounted = resetTournamentScrollPosition()

      if (!pageIsMounted && attempts < 60) {
        frame = window.requestAnimationFrame(resetWhenMounted)
        return
      }

      if (pageIsMounted) {
        frame = window.requestAnimationFrame(() => {
          if (!cancelled) resetTournamentScrollPosition()
        })
      }
    }

    resetWhenMounted()
    return () => {
      cancelled = true
      window.cancelAnimationFrame(frame)
    }
  }, [competitionId])
'''
          replace_once(app, old_effect, new_effect)

          defence = 'src/components/tournament/TournamentDefendingPoints.tsx'
          replace_once(defence,
              "import { Minus, ShieldCheck, TrendingDown, TrendingUp } from 'lucide-react'",
              "import { Minus, TrendingDown, TrendingUp } from 'lucide-react'")
          replace_once(defence,
              '''          <button type="button" aria-expanded={expanded} onClick={() => setExpanded((value) => !value)}>
            {expanded ? 'Collapse' : 'Expand'}
          </button>
          <ShieldCheck size={20} />''',
              '''          <button type="button" aria-expanded={expanded} onClick={() => setExpanded((value) => !value)}>
            {expanded ? 'Collapse' : 'Expand'}
          </button>''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "bracko87"
          git config user.email "aleksandarlevnajic@gmail.com"
          git add src/App.tsx src/components/tournament/TournamentDefendingPoints.tsx
          git rm .github/workflows/tlg_tournament_scroll_fix_temp.yml
          git commit -m "Fix tournament initial scroll position"
          git push origin main
