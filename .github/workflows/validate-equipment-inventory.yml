name: Validate Equipment Inventory

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/dashboard/Equipment.tsx'
      - 'src/styles/equipment-marketplace-v2.css'
      - '.github/workflows/validate-equipment-inventory.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
