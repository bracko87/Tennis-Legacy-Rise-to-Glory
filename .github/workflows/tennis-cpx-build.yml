name: Tennis Legacy release validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Newer work replaces superseded builds on the same branch or pull request.
concurrency:
  group: tennis-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies once
        run: npm ci
      - name: Validate Portuguese key and placeholder parity
        run: npm run check:pt
      - name: Validate Preferences translations
        run: npm run check:preferences
      - name: Validate Premium package descriptions in all eight languages
        run: node --experimental-strip-types --test tests/premiumFeatureGuide.test.mjs
      - name: Verify sidebar collapse preference persists across navigation
        run: node --experimental-strip-types --test tests/sidebarPreference.test.mjs
      - name: Verify mobile route audit inventory against actual App router
        run: npm run check:mobile-routes
      - name: Validate Private Life career integration contracts
        run: node --test tests/lifestyleCareerContract.test.mjs
      - name: Validate schema-only Private Life sandbox safety
        run: node --test tests/privateLifeSandbox.test.mjs
      - name: Set up Python for offline database migration syntax validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Private Life SQL and PL/pgSQL syntax (no database connection)
        run: |
          python -m pip install --disable-pip-version-check pglast==8.7
          python scripts/validate-private-life-sql.py
      - name: Compile with a disposable localhost Supabase configuration
        env:
          TL_SUPABASE_URL: http://127.0.0.1:54321
          TL_SUPABASE_PUBLISHABLE_KEY: sb_publishable_disposable_local_test_only
        run: |
          node scripts/build.mjs --compile-local
          grep -rqF 'http://127.0.0.1:54321' dist || (echo 'Local Supabase URL missing from browser bundle' && exit 1)
          grep -rqF 'sb_publishable_disposable_local_test_only' dist || (echo 'Local publishable key missing from browser bundle' && exit 1)
      - name: Ensure production build refuses localhost override
        env:
          TL_SUPABASE_URL: http://127.0.0.1:54321
          TL_SUPABASE_PUBLISHABLE_KEY: sb_publishable_disposable_local_test_only
        run: |
          if node scripts/build.mjs --production; then
            echo 'Unsafe: production build accepted disposable local backend'
            exit 1
          fi
      - name: Build production website
        run: npm run build
      - name: Validate public SEO pages, sitemap, and private noindex protections
        run: npm run check:seo
      - name: Assert CPX integration is bundled
        run: |
          if ! grep -rlq 'Earn Free Coins' dist; then
            echo "CPX Earn Free Coins UI missing from production output"
            exit 1
          fi

  private-life-ephemeral-db:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tennis_ephemeral
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tennis_ephemeral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Private Life foundation migration against disposable PostgreSQL
        env:
          PGPASSWORD: disposable_test_password
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: tennis_ephemeral
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql -v ON_ERROR_STOP=1 \
            -f tests/private_life_ephemeral_fixture.sql \
            -f supabase/migrations/20261026093000_private_life_career_foundation_v1.sql \
            -f tests/private_life_ephemeral_assertions.sql
          python3 scripts/extract-private-life-jet-routines.py > /tmp/private_life_jet_routines.sql
          psql -v ON_ERROR_STOP=1 \
            -f tests/private_life_ephemeral_jet_fixture.sql \
            -f /tmp/private_life_jet_routines.sql \
            -f tests/private_life_ephemeral_jet_assertions.sql
          python3 scripts/extract-private-life-aircraft-catalog.py > /tmp/private_life_aircraft_catalog.sql
          psql -v ON_ERROR_STOP=1 \
            -f tests/private_life_ephemeral_catalog_fixture.sql \
            -f /tmp/private_life_aircraft_catalog.sql \
            -f tests/private_life_ephemeral_catalog_assertions.sql
          python3 scripts/extract-private-life-flight-lifecycle.py > /tmp/private_life_travel_lifecycle.sql
          psql -v ON_ERROR_STOP=1 \
            -f tests/private_life_ephemeral_travel_lifecycle_fixture.sql \
            -f /tmp/private_life_travel_lifecycle.sql \
            -f tests/private_life_ephemeral_travel_lifecycle_assertions.sql
          psql -v ON_ERROR_STOP=1 \
            -f tests/private_life_ephemeral_security_assertions.sql
          # Check the actual unreleased SQL hardening against disposable
          # PostgreSQL functions; no production DB or credentials involved.
          python3 scripts/extract-private-life-travel-permissions.py > /tmp/private_life_travel_permissions.sql
          psql -v ON_ERROR_STOP=1 \
            -f tests/private_life_ephemeral_travel_permission_fixture.sql \
            -f /tmp/private_life_travel_permissions.sql \
            -f tests/private_life_ephemeral_travel_permission_assertions.sql

  # This is run on GitHub, never on the player's Windows computer.
  # It tests all three migration FILES unchanged (in release order) against
  # a synthetic schema, not a dump of production or a Supabase development branch.
  private-life-combined-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tennis_combined_private_life
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tennis_combined_private_life"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply three real Private Life migrations to synthetic database
        env:
          PGPASSWORD: disposable_test_password
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGDATABASE: tennis_combined_private_life
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 \
            -f tests/private_life_ephemeral_fixture.sql \
            -f tests/private_life_full_migration_cron_fixture.sql \
            -f supabase/migrations/20261026093000_private_life_career_foundation_v1.sql \
            -f tests/private_life_full_migration_compat_fixture.sql \
            -f tests/private_life_sandbox_reference_seed.sql \
            -f supabase/migrations/20261026094500_private_life_jet_travel_integration_v1.sql \
            -f supabase/migrations/20261026095500_private_life_profile_residence_v1.sql \
            -f tests/private_life_career_db_smoke.sql \
            -f tests/private_life_full_migration_assertions.sql
