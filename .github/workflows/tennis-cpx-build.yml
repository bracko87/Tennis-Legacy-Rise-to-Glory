name: Tennis Legacy CPX survey build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production website
        run: npm run build
      - name: Assert CPX integration is bundled
        run: |
          if ! grep -rlq 'Earn Free Coins' dist; then
            echo "CPX Earn Free Coins UI missing from production output"
            exit 1
          fi
