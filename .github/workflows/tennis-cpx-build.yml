name: Tennis Legacy release validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Newer work replaces superseded builds on the same branch or pull request.
concurrency:
  group: tennis-release-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies once
        run: npm ci
      - name: Validate Portuguese key and placeholder parity
        run: npm run check:pt
      - name: Validate Preferences translations
        run: npm run check:preferences
      - name: Validate Premium package descriptions in all eight languages
        run: node --experimental-strip-types --test tests/premiumFeatureGuide.test.mjs
      - name: Verify sidebar collapse preference persists across navigation
        run: node --experimental-strip-types --test tests/sidebarPreference.test.mjs
      - name: Build production website
        run: npm run build
      - name: Validate public SEO pages, sitemap, and private noindex protections
        run: npm run check:seo
      - name: Assert CPX integration is bundled
        run: |
          if ! grep -rlq 'Earn Free Coins' dist; then
            echo "CPX Earn Free Coins UI missing from production output"
            exit 1
          fi
