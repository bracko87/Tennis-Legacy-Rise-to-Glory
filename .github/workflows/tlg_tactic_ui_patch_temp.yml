name: Temporary tactic UI cleanup and verification

on:
  push:
    paths:
      - '.github/workflows/tlg_tactic_ui_patch_temp.yml'

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove duplicate local tactic UI patch
        run: git revert --no-commit 6823ae644cbfdf43fda5f71748a8f462ec242415

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npx --yes -p typescript@5.8.3 tsc --noEmit --skipLibCheck

      - name: Production build verification
        run: npm run build

      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "Tennis Legacy automation"
          git config user.email "actions@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Keep single authoritative match tactic status UI"
          git push origin HEAD:main
