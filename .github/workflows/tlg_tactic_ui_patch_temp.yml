name: Temporary tactic UI patch and verification

on:
  push:
    paths:
      - '.github/workflows/tlg_tactic_ui_patch_temp.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch tactic UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tsx_path = Path('src/pages/dashboard/Tournament.tsx')
          css_path = Path('src/styles/tournament-match-polish.css')
          text = tsx_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''interface MatchTacticResponse {
            match_status: MatchDetail['status']
            editable: boolean
            source: 'automatic_default' | 'tournament_default' | 'match_override'
            tournament_default: TournamentTactic
            override: TournamentTactic | null
            effective: TournamentTactic
          }''',
          '''interface GameCalendarDate {
            season: number
            month: number
            day: number
            season_week: number
          }

          interface MatchTacticResponse {
            match_status: MatchDetail['status']
            editable: boolean
            source: 'automatic_default' | 'tournament_default' | 'match_override'
            tournament_default: TournamentTactic
            override: TournamentTactic | null
            effective: TournamentTactic
            scheduled_game_second: number | null
            scheduled_start_minute: number | null
            scheduled_game_date: GameCalendarDate | null
            tactic_lock_game_second: number | null
            tactic_lock_game_date: GameCalendarDate | null
            tactic_lock_minute_of_day: number | null
            current_game_second: number
            lock_minutes_before_start: number
          }''',
          'MatchTacticResponse interface')

          replace_once(
          '''function formatDrawScore(match: TournamentDrawMatch, perspectivePlayerId: string) {
            const playerIsOne = match.player1_id === perspectivePlayerId
            const own = playerIsOne ? match.player1_set_scores : match.player2_set_scores
            const opponent = playerIsOne ? match.player2_set_scores : match.player1_set_scores
            if (!own.length || own.length !== opponent.length) return 'Result recorded'
            return own.map((games, index) => `${games}–${opponent[index]}`).join(', ')
          }

          export default function TournamentPage() {''',
          '''function formatDrawScore(match: TournamentDrawMatch, perspectivePlayerId: string) {
            const playerIsOne = match.player1_id === perspectivePlayerId
            const own = playerIsOne ? match.player1_set_scores : match.player2_set_scores
            const opponent = playerIsOne ? match.player2_set_scores : match.player1_set_scores
            if (!own.length || own.length !== opponent.length) return 'Result recorded'
            return own.map((games, index) => `${games}–${opponent[index]}`).join(', ')
          }

          const GAME_MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] as const

          function formatGameDeadline(date: GameCalendarDate | null, minuteOfDay: number | null) {
            if (!date || minuteOfDay === null || minuteOfDay === undefined) return 'Schedule pending'
            const hours = Math.floor(minuteOfDay / 60)
            const minutes = minuteOfDay % 60
            const month = GAME_MONTH_NAMES[date.month - 1] ?? `Month ${date.month}`
            return `${month} ${date.day}, Season ${date.season} · ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`
          }

          export default function TournamentPage() {''',
          'game deadline formatter')

          replace_once(
          '''<button type="button" className={`tlg-tactic-info-button${showHelp ? ' active' : ''}`} aria-label="Explain tactical settings" aria-expanded={showHelp} onClick={() => setShowHelp((current) => !current)}>i</button>''',
          '''<button type="button" className={`tlg-tactic-guidance-toggle${showHelp ? ' active' : ''}`} aria-expanded={showHelp} onClick={() => setShowHelp((current) => !current)}>{showHelp ? 'Hide guidance' : 'Show guidance'}</button>''',
          'guidance toggle')

          replace_once(
          '''  const sourceLabel = data?.source === 'match_override' ? 'Match override' : data?.source === 'tournament_default' ? 'Tournament default' : 'Automatic Balanced default'
            const effective = data?.effective ?? draft
            const editable = Boolean(data?.editable)

            return (''',
          '''  const sourceLabel = data?.source === 'match_override' ? 'Match override' : data?.source === 'tournament_default' ? 'Tournament default' : 'Automatic Balanced default'
            const effective = data?.effective ?? draft
            const editable = Boolean(data?.editable)
            const lockDeadline = formatGameDeadline(data?.tactic_lock_game_date ?? null, data?.tactic_lock_minute_of_day ?? null)
            const tacticStatusLabel = data?.source === 'match_override' ? 'Match tactic override saved' : 'Tactic unchanged for this match'

            return (''',
          'tactic deadline variables')

          replace_once(
          '''      {showHelp && <TacticHelp tactic={editable ? draft : effective} />}

                {loading ?''',
          '''      {data && <div className={`tlg-match-tactic-deadline-row${editable ? ' editable' : ' locked'}`}>
                  <div className="tlg-match-tactic-deadline-copy"><span>{editable ? 'Tactic can be changed until' : 'Tactic locked at'}</span><strong>{lockDeadline}</strong><small>{data.lock_minutes_before_start} minutes before the scheduled match start</small></div>
                  <div className="tlg-match-tactic-change-status"><span>Match-specific status</span><strong>{tacticStatusLabel}</strong></div>
                </div>}

                {loading ?''',
          'deadline status row')

          replace_once(
          '''<><div className="tlg-match-tactic-locked">This match has already started or finished, so its tactic is locked. The effective tactic used for the match is shown below.</div><TacticSummary tactic={effective} /><TacticEffects tactic={effective} locked /></>''',
          '''<><div className="tlg-match-tactic-locked">This match is no longer editable. The effective tactic used for the match is shown below.</div><TacticSummary tactic={effective} />{showHelp && <div className="tlg-tactic-guidance"><TacticHelp tactic={effective} /><TacticEffects tactic={effective} locked /></div>}</>''',
          'locked guidance')

          replace_once(
          '''          <TacticEffects tactic={draft} />''',
          '''          {showHelp && <div className="tlg-tactic-guidance"><TacticHelp tactic={draft} /><TacticEffects tactic={draft} /></div>}''',
          'editable guidance')

          tsx_path.write_text(text, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          marker = '/* Tactic lock status + unified collapsed guidance */'
          if marker in css:
              raise SystemExit('CSS patch marker already exists')
          css += r'''

          /* Tactic lock status + unified collapsed guidance */
          .tlg-tactic-guidance-toggle {
            min-height: 38px;
            padding: 0 13px;
            align-self: center;
            border: 1px solid #cfe0eb;
            border-radius: 8px;
            background: #fff;
            color: #0b6fc8;
            font-size: .63rem;
            font-weight: 850;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 3px 10px rgba(21,71,105,.06);
          }

          .tlg-tactic-guidance-toggle:hover,
          .tlg-tactic-guidance-toggle.active {
            border-color: #0b6fc8;
            background: #edf7fe;
          }

          .tlg-match-tactic-deadline-row {
            display: grid;
            grid-template-columns: minmax(0,1.45fr) minmax(220px,.75fr);
            gap: 18px;
            align-items: center;
            margin: 0 0 16px;
            padding: 11px 14px;
            border: 1px solid #efc5c5;
            border-left: 4px solid #d64b4b;
            border-radius: 9px;
            background: #fff7f7;
          }

          .tlg-match-tactic-deadline-row.locked {
            background: #fff3f3;
            border-color: #e8b2b2;
            border-left-color: #b72f2f;
          }

          .tlg-match-tactic-deadline-copy,
          .tlg-match-tactic-change-status {
            display: grid;
            gap: 3px;
            min-width: 0;
          }

          .tlg-match-tactic-deadline-copy > span,
          .tlg-match-tactic-change-status > span {
            color: #a23d3d;
            font-size: .56rem;
            font-weight: 850;
            letter-spacing: .06em;
            text-transform: uppercase;
          }

          .tlg-match-tactic-deadline-copy > strong {
            color: #7f2525;
            font-size: .78rem;
          }

          .tlg-match-tactic-deadline-copy > small {
            color: #8d6868;
            font-size: .58rem;
          }

          .tlg-match-tactic-change-status {
            padding-left: 16px;
            border-left: 1px solid #efcccc;
          }

          .tlg-match-tactic-change-status > strong {
            color: #563434;
            font-size: .69rem;
          }

          .tlg-tactic-guidance {
            margin-top: 16px;
            border: 1px solid #cfe2ef;
            border-radius: 12px;
            background: #fff;
            overflow: hidden;
          }

          .tlg-tactic-guidance .tlg-tactic-help,
          .tlg-tactic-guidance .tlg-tactic-effects {
            margin: 0;
            border: 0;
            border-radius: 0;
            background: #fff;
          }

          .tlg-tactic-guidance .tlg-tactic-help > div {
            display: block;
          }

          .tlg-tactic-guidance .tlg-tactic-help article {
            display: grid;
            grid-template-columns: minmax(130px,.55fr) minmax(150px,.65fr) minmax(0,1.8fr);
            gap: 12px;
            align-items: center;
            padding: 9px 14px;
            border-right: 0;
            border-bottom: 1px solid #edf2f5;
            background: transparent;
          }

          .tlg-tactic-guidance .tlg-tactic-help article > strong {
            margin: 0;
          }

          .tlg-tactic-guidance .tlg-tactic-help article p {
            margin: 0;
          }

          .tlg-tactic-guidance .tlg-tactic-effects {
            border-top: 1px solid #dcebf4;
          }

          .tlg-tactic-guidance .tlg-tactic-effects-grid {
            display: block;
            padding: 0;
          }

          .tlg-tactic-guidance .tlg-tactic-effects-grid article {
            display: grid;
            grid-template-columns: minmax(210px,.8fr) minmax(0,1.7fr);
            gap: 14px;
            align-items: center;
            padding: 9px 14px;
            border: 0;
            border-bottom: 1px solid #edf2f5;
            border-radius: 0;
            background: transparent;
          }

          .tlg-tactic-guidance .tlg-tactic-effects-grid article p {
            margin: 0;
          }

          .tlg-tactic-guidance .tlg-tactic-effects-note {
            padding: 10px 14px 12px;
          }

          @media(max-width:760px) {
            .tlg-match-tactic-head-tools {
              flex-wrap: wrap;
            }
            .tlg-match-tactic-deadline-row {
              grid-template-columns: 1fr;
              gap: 9px;
            }
            .tlg-match-tactic-change-status {
              padding: 9px 0 0;
              border-left: 0;
              border-top: 1px solid #efcccc;
            }
            .tlg-tactic-guidance .tlg-tactic-help article,
            .tlg-tactic-guidance .tlg-tactic-effects-grid article {
              grid-template-columns: 1fr;
              gap: 4px;
            }
          }
          '''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript verification
        run: npx --yes -p typescript@5.8.3 tsc --noEmit --skipLibCheck

      - name: Production build verification
        run: npm run build

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "Tennis Legacy automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/dashboard/Tournament.tsx src/styles/tournament-match-polish.css
          git diff --cached --check
          git commit -m "Polish match tactic guidance and lock status"
          git push origin HEAD:main
