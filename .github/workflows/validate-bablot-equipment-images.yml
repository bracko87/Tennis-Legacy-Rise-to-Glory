name: Validate Bablot equipment images

on:
  push:
    branches: [main]
    paths:
      - 'src/main.tsx'
      - 'src/styles/equipment-detail-media-fill.css'
      - 'supabase/migrations/20260916121900_add_bablot_racquet_product_images.sql'
      - '.github/workflows/validate-bablot-equipment-images.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
