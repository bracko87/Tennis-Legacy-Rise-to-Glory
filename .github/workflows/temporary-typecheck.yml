name: Temporary TypeScript check

on:
  push:
    paths:
      - 'src/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/temporary-typecheck.yml'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        id: typecheck
        shell: bash
        run: |
          set +e
          npx --yes --package=typescript@5.8.3 tsc --noEmit 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Fail when TypeScript reports errors
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
