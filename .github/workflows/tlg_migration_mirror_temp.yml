name: Temporary migration mirror cleanup

on:
  push:
    paths:
      - '.github/workflows/tlg_migration_mirror_temp.yml'

permissions:
  contents: write

jobs:
  align-migration-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align travel guard migration filename with production
        shell: bash
        run: |
          test -f supabase/migrations/20260909101200_unresolved_tournament_return_travel_guard_v1.sql
          test ! -e supabase/migrations/20260909101015_unresolved_tournament_return_travel_guard_v1.sql
          git mv supabase/migrations/20260909101200_unresolved_tournament_return_travel_guard_v1.sql supabase/migrations/20260909101015_unresolved_tournament_return_travel_guard_v1.sql
          git diff --cached --check

      - name: Commit filename alignment
        shell: bash
        run: |
          git config user.name "Tennis Legacy automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Align return travel guard migration version"
          git push origin HEAD:main
