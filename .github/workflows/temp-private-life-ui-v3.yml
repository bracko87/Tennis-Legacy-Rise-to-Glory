name: Temp Private Life UI v3
on:
  push:
    paths:
      - '.github/workflows/temp-private-life-ui-v3.yml'
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python .github/scripts/private_life_investment_history_patch.py
      - run: npm ci
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/private-life/PrivateLifeInvestments.tsx src/pages/dashboard/PrivateLife.tsx src/styles/private-life-history.css
          git diff --cached --quiet && exit 0
          git commit -m "Improve investment timing visibility and asset history"
          git push origin main
