name: Temporary pre-match verification
on:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npx --yes typescript@latest tsc --noEmit --skipLibCheck
      - name: Production build
        run: npm run build
