name: Temp Calendar accepted week build
on:
  push:
    paths:
      - '.github/workflows/temp-calendar-accepted-week-build.yml'
permissions:
  contents: write
jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python scripts/temp_calendar_accepted_week_patch.py
      - run: npm ci
      - run: npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dashboard/Calendar.tsx src/styles/calendar-player-activity.css
          git commit -m "Reserve accepted main-draw weeks in calendar" || exit 0
          git push
