name: Validate equipment marketplace

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/dashboard/Equipment.tsx'
      - 'src/styles/equipment-marketplace-v2.css'
      - 'public/equipment/marketplace/**'
      - 'supabase/migrations/20260915151228_equipment_marketplace_catalog_resale_v2.sql'
      - '.github/workflows/validate-equipment-marketplace.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
