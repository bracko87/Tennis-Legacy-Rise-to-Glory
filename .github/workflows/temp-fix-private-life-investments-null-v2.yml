name: Temporary investments null fix v2
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-fix-private-life-investments-null-v2.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Patch source
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('src/components/private-life/PrivateLifeInvestments.tsx'); s=p.read_text(); old='    const next = data as unknown as InvestmentDashboard\n    setDashboard(next)\n    return next\n'; new='    const raw = data as unknown as InvestmentDashboard\n    const next: InvestmentDashboard = {\n      ...raw,\n      positions: Array.isArray(raw.positions) ? raw.positions : [],\n      instruments: Array.isArray(raw.instruments) ? raw.instruments : [],\n      trades: Array.isArray(raw.trades) ? raw.trades : [],\n    }\n    setDashboard(next)\n    return next\n'; assert old in s, 'dashboard normalization target not found'; s=s.replace(old,new,1); old2='  const portfolioValuePrecise = dashboard.positions.reduce((sum, position) => sum + Number(position.market_value_precise ?? position.market_value ?? 0), 0)\n  const unrealizedPrecise = dashboard.positions.reduce((sum, position) => sum + Number(position.unrealized_pnl_precise ?? position.unrealized_pnl ?? 0), 0)\n'; new2='  const safePositions = dashboard?.positions ?? []\n  const portfolioValuePrecise = safePositions.reduce((sum, position) => sum + Number(position.market_value_precise ?? position.market_value ?? 0), 0)\n  const unrealizedPrecise = safePositions.reduce((sum, position) => sum + Number(position.unrealized_pnl_precise ?? position.unrealized_pnl ?? 0), 0)\n'; assert old2 in s, 'portfolio render target not found'; p.write_text(s.replace(old2,new2,1))"
      - run: npm ci
      - run: npm run build
      - name: Commit source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/private-life/PrivateLifeInvestments.tsx
          git commit -m "Fix Private Life investments initial render crash"
          git push origin main
