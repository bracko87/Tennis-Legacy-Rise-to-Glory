name: Validate simplified equipment

on:
  push:
    branches: [main]
    paths:
      - 'src/pages/dashboard/Equipment.tsx'
      - 'supabase/migrations/20260915153600_simplify_equipment_to_four_categories.sql'
      - '.github/workflows/validate-equipment-four-types.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
