name: Temporary Private Life Market Patch

on:
  push:
    paths:
      - '.github/workflows/temp-private-life-market-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Private Life market UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1))

          inv = 'src/components/private-life/PrivateLifeInvestments.tsx'
          replace_once(inv,
          '''  history?: unknown[]
            intraday_history?: unknown[]
            [key: string]: unknown
          }''',
          '''  history?: unknown[]
            intraday_history?: unknown[]
            game_checked_total_seconds?: number | null
            game_last_change_total_seconds?: number | null
            provider_quote_as_of?: string | null
            price_changed_on_last_check?: boolean | null
            refresh_cadence_game_minutes?: number | null
            [key: string]: unknown
          }''')

          replace_once(inv,
          '''function quoteTime(value: string | null) {
            if (!value) return 'No quote yet'
            const date = new Date(value)
            if (Number.isNaN(date.getTime())) return 'Quote time unavailable'
            return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' })
          }''',
          '''const GAME_MONTHS = [
            ['January', 31], ['February', 29], ['March', 31], ['April', 30],
            ['May', 31], ['June', 30], ['July', 31], ['August', 31],
            ['September', 30], ['October', 31], ['November', 30], ['December', 31],
          ] as const

          function gameTimeLabel(metadata?: QuoteMetadata | null) {
            const raw = finiteNumber(metadata?.game_last_change_total_seconds)
            if (raw === null || raw < 0) return 'Game time unavailable'
            const total = Math.floor(raw)
            const secondsPerDay = 86400
            const secondsPerSeason = 366 * secondsPerDay
            const season = Math.floor(total / secondsPerSeason) + 1
            let dayIndex = Math.floor((total % secondsPerSeason) / secondsPerDay)
            const secondOfDay = total % secondsPerDay
            let monthName = 'January'
            let day = 1
            for (const [name, days] of GAME_MONTHS) {
              if (dayIndex < days) {
                monthName = name
                day = dayIndex + 1
                break
              }
              dayIndex -= days
            }
            const hour = Math.floor(secondOfDay / 3600)
            const minute = Math.floor((secondOfDay % 3600) / 60)
            return `Season ${season} · ${monthName} ${day} · ${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`
          }''')

          replace_once(inv,
          '''        <div><span>Last market quote</span><strong>{quoteTime(instrument.quote_as_of)}</strong></div>''',
          '''        <div><span>Last price change (game time)</span><strong>{gameTimeLabel(instrument.quote_metadata)}</strong></div>''')

          replace_once(inv,
          '''      <p>Stocks are cached every 15 minutes during the weekday U.S. market window; crypto is cached every 15 minutes around the clock. Stock prices do not move while the underlying market is closed.</p>''',
          '''      <p>Reference prices are checked every 15 in-game minutes. Stocks only change when the external market provides a new price; crypto can change continuously.</p>''')

          replace_once(inv,
          '''      <div className="private-life-market-update-note"><strong>Automatic market cache:</strong> stocks refresh every 15 minutes during the weekday U.S. market window; crypto refreshes every 15 minutes 24/7. Stocks remain unchanged on weekends and market holidays because there is no underlying trading session.</div>''',
          '''      <div className="private-life-market-update-note"><strong>Automatic market cache:</strong> prices are checked every 15 in-game minutes. Stocks can only change while their external market provides a new quote; crypto can move continuously 24/7. The time shown beside a price is Tennis Legacy game time, not real-world time.</div>''')

          replace_once(inv,
          '''                  <div className="private-life-trade-quote-meta"><span>{quoteSource(selectedInstrument.quote_source)}</span><span>{quoteTime(selectedInstrument.quote_as_of)}</span></div>''',
          '''                  <div className="private-life-trade-quote-meta"><span>{quoteSource(selectedInstrument.quote_source)}</span><span>{gameTimeLabel(selectedInstrument.quote_metadata)}</span></div>''')

          replace_once(inv,
          '''                      <td><strong>{marketPrice(position.price, currency)}</strong><span>{quoteTime(position.quote_as_of)}</span></td>''',
          '''                      <td><strong>{marketPrice(position.price, currency)}</strong><span>{gameTimeLabel(position.quote_metadata)}</span></td>''')

          pl = 'src/pages/dashboard/PrivateLife.tsx'
          replace_once(pl,
          '''  location_priced?: boolean
            affordable: boolean''',
          '''  location_priced?: boolean
            market_monthly_change_bps?: number | null
            previous_market_price?: number | null
            affordable: boolean''')

          replace_once(pl,
          '''  pending_sale?: PendingSale | null
          }''',
          '''  pending_sale?: PendingSale | null
            asset_monthly_change_bps?: number | null
            property_monthly_change_bps?: number | null
            previous_market_price?: number | null
          }''')

          replace_once(pl,
          '''  annual_value_rate_bps: number
            sort_order: number
          }''',
          '''  annual_value_rate_bps: number
            monthly_change_bps?: number | null
            sort_order: number
          }''')

          replace_once(pl,
          '''  effective_owned: boolean
            location?: PropertyLocation
          }''',
          '''  effective_owned: boolean
            effective_market_change_bps?: number | null
            location?: PropertyLocation
          }''')

          replace_once(pl,
          '''function matchesPriceBand(price: number, band: MarketplacePrice) {''',
          '''function marketMoveText(rateBps: number | null | undefined) {
            if (rateBps === null || rateBps === undefined || !Number.isFinite(Number(rateBps))) return 'No monthly move yet'
            const numeric = Number(rateBps)
            if (numeric === 0) return 'Stable this month'
            const percent = Math.abs(numeric) / 100
            return `${numeric > 0 ? '+' : '-'}${percent.toFixed(percent % 1 === 0 ? 0 : 1)}% this month`
          }

          function matchesPriceBand(price: number, band: MarketplacePrice) {''')

          replace_once(pl,
          '''          effective_affordable: Boolean(asset.affordable),
                    effective_owned: Boolean(asset.owned),
                  }]''',
          '''          effective_affordable: Boolean(asset.affordable),
                    effective_owned: Boolean(asset.owned),
                    effective_market_change_bps: asset.market_monthly_change_bps ?? null,
                  }]''')

          replace_once(pl,
          '''        effective_owned: alreadyOwned,
                  location: selectedPropertyLocation,
                }]''',
          '''        effective_owned: alreadyOwned,
                  effective_market_change_bps: selectedPropertyLocation.monthly_change_bps ?? null,
                  location: selectedPropertyLocation,
                }]''')

          replace_once(pl,
          '''      if (marketSort === 'appreciation_desc') return b.effective_value_rate_bps - a.effective_value_rate_bps || a.effective_price - b.effective_price''',
          '''      if (marketSort === 'appreciation_desc') return Number(b.effective_market_change_bps ?? -9999) - Number(a.effective_market_change_bps ?? -9999) || b.effective_value_rate_bps - a.effective_value_rate_bps || a.effective_price - b.effective_price''')

          replace_once(pl,
          '''                          <div className="private-life-owned-value-row"><span>Value trend</span><strong>{trendText(asset.annual_value_rate_bps)}</strong></div>''',
          '''                          <div className="private-life-owned-value-row"><span>Market move</span><strong className={Number(asset.property_monthly_change_bps ?? asset.asset_monthly_change_bps ?? 0) < 0 ? 'private-life-trend-negative' : Number(asset.property_monthly_change_bps ?? asset.asset_monthly_change_bps ?? 0) > 0 ? 'private-life-trend-positive' : ''}>{marketMoveText(asset.property_monthly_change_bps ?? asset.asset_monthly_change_bps)}</strong></div>''')

          replace_once(pl,
          '''<option value="appreciation_desc">Best value trend</option>''',
          '''<option value="appreciation_desc">Best market move</option>''')

          replace_once(pl,
          '''                  const isPositive = listing.effective_value_rate_bps > 0
                            const canBuy = listing.effective_affordable && !listing.effective_owned''',
          '''                  const marketMove = listing.effective_market_change_bps
                            const isPositive = Number(marketMove ?? 0) > 0
                            const canBuy = listing.effective_affordable && !listing.effective_owned''')

          replace_once(pl,
          '''                          <div className="private-life-card-stat"><span>Value trend</span><strong className={listing.effective_value_rate_bps < 0 ? 'private-life-trend-negative' : isPositive ? 'private-life-trend-positive' : ''}>{listing.effective_value_rate_bps < 0 ? <TrendingDown size={12} /> : isPositive ? <TrendingUp size={12} /> : null} {trendText(listing.effective_value_rate_bps)}</strong></div>''',
          '''                          <div className="private-life-card-stat"><span>Market move</span><strong className={Number(marketMove ?? 0) < 0 ? 'private-life-trend-negative' : isPositive ? 'private-life-trend-positive' : ''}>{Number(marketMove ?? 0) < 0 ? <TrendingDown size={12} /> : isPositive ? <TrendingUp size={12} /> : null} {marketMoveText(marketMove)}</strong></div>''')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git rm .github/workflows/temp-private-life-market-patch.yml
          git add src/components/private-life/PrivateLifeInvestments.tsx src/pages/dashboard/PrivateLife.tsx
          git commit -m "Use game time for quotes and show dynamic asset markets"
          git push origin HEAD:main
