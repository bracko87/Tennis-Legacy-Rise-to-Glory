name: Apply equipment market sponsor fixes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-equipment-market-sponsor-fixes.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply UI patch
        run: python .github/scripts/apply_equipment_market_sponsor_fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit patched UI
        run: |
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/dashboard/Equipment.tsx src/components/equipment/TechnicalSponsorsPanel.tsx src/styles/equipment-technical-sponsor.css src/styles/equipment-refinement-v2.css
          git diff --cached --check
          git commit -m "Fix sponsored equipment purchase flow"
          git push origin main
