name: Validate Tennis Premium trial

# Release validation also runs the locale and production build checks.
# Keep this specialist workflow for explicit troubleshooting only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-premium-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-locales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify complete Portuguese locale and variable placeholders
        run: npm run check:pt
      - name: Compile production Tennis Legacy bundle
        run: npm run build
