name: Validate Tennis Premium trial
on:
  push:
    branches: [main]
    paths:
      - 'src/components/premium/**'
      - 'src/components/layout/GameLayout.tsx'
      - 'src/hooks/useCommerce.ts'
      - 'src/pages/manager/ProPackages.tsx'
      - 'src/i18n/locales/**'
      - 'supabase/migrations/*tennis*trial*.sql'
      - 'package.json'
      - '.github/workflows/tennis-premium-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-locales:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify complete Portuguese locale and variable placeholders
        run: npm run check:pt
      - name: Compile production Tennis Legacy bundle
        run: npm run build
