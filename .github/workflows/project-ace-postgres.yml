name: Ace isolated PostgreSQL review
on:
  push:
    branches: [project-ace]
    paths:
      - 'experiments/project-ace/**'
      - '.github/workflows/project-ace-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ace_review
          POSTGRES_PASSWORD: ace-disposable-admin
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ace_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify disposable PostgreSQL version and matching container clients
        env:
          PGPASSWORD: ace-disposable-admin
          ACE_REVIEW_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          psql --version
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -c 'SHOW server_version_num' | cut -c1-2)" = 17
          docker exec "$ACE_REVIEW_CONTAINER" pg_dump --version | grep -E 'PostgreSQL\) 17\.'
          docker exec "$ACE_REVIEW_CONTAINER" pg_restore --version | grep -E 'PostgreSQL\) 17\.'
      - name: Install isolated review schema
        env:
          PGPASSWORD: ace-disposable-admin
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -c "CREATE ROLE ace_review_worker LOGIN PASSWORD 'ace-disposable-worker'; CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE ace_cutover_ace LOGIN PASSWORD 'ace-disposable-ace'; CREATE ROLE ace_cutover_legacy LOGIN PASSWORD 'ace-disposable-legacy'; CREATE ROLE ace_cutover_external LOGIN PASSWORD 'ace-disposable-external';"
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review <<'SQL'
          CREATE SCHEMA ace_migration_fixture;
          CREATE TABLE ace_migration_fixture.guard(singleton boolean PRIMARY KEY CHECK(singleton),marker text NOT NULL);
          INSERT INTO ace_migration_fixture.guard VALUES(true,'ace-disposable-ci-v025');
          CREATE TABLE public.ace_legacy_rehearsal(id integer PRIMARY KEY,payload jsonb NOT NULL);
          INSERT INTO public.ace_legacy_rehearsal VALUES(1,'{"status":"completed","winner":"legacy-player","prize":5000}');
          SQL
          export ACE_MIGRATION_REHEARSAL=disposable-ci-only
          sql() { psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review "$@"; }
          before="$(sql -c 'SELECT md5(jsonb_agg(to_jsonb(t) ORDER BY id)::text) FROM public.ace_legacy_rehearsal t')"
          if bash experiments/project-ace/migration-rehearsal.sh inject-failure > "$RUNNER_TEMP/ace-install-failure.log" 2>&1; then
            echo "Fault injection unexpectedly succeeded"; exit 1
          fi
          grep -q ACE_REHEARSAL_INJECTED_FAILURE "$RUNNER_TEMP/ace-install-failure.log"
          test "$(sql -c "SELECT count(*) FROM pg_namespace WHERE nspname IN ('ace_review','ace_cutover_review','ace_migration_journal')")" = 0
          test "$before" = "$(sql -c 'SELECT md5(jsonb_agg(to_jsonb(t) ORDER BY id)::text) FROM public.ace_legacy_rehearsal t')"
          bash experiments/project-ace/migration-rehearsal.sh install
          sql -f experiments/project-ace/migration-rehearsal-verify.sql
          if bash experiments/project-ace/migration-rehearsal.sh install > "$RUNNER_TEMP/ace-repeat-install.log" 2>&1; then
            echo "Repeat install unexpectedly succeeded"; exit 1
          fi
          grep -q 'review schemas already installed' "$RUNNER_TEMP/ace-repeat-install.log"
          test "$before" = "$(sql -c 'SELECT md5(jsonb_agg(to_jsonb(t) ORDER BY id)::text) FROM public.ace_legacy_rehearsal t')"
          sql -c 'SELECT ordinal,filename,sha256 FROM ace_migration_journal.installed ORDER BY ordinal'
      - name: Native database worker integration
        env:
          ACE_REVIEW_DB: '1'
          ACE_REVIEW_DB_PASSWORD: ace-disposable-worker
          ACE_REVIEW_DB_PORT: '55432'
        run: |
          node experiments/project-ace/postgres-worker.test.cjs
          node experiments/project-ace/postgres-service.test.cjs
          node experiments/project-ace/postgres-http.test.cjs
          node experiments/project-ace/app-review.test.cjs
          node experiments/project-ace/app-coaching.test.cjs
          node experiments/project-ace/official-settlement-db.test.cjs
          node experiments/project-ace/finalization-review.test.cjs
          node experiments/project-ace/career-processing-review.test.cjs
          node experiments/project-ace/health-walkover.test.cjs
          node experiments/project-ace/health-lifecycle.test.cjs
          node experiments/project-ace/health-field-effects.test.cjs
          node experiments/project-ace/medical-settlement.test.cjs
          node experiments/project-ace/career-settlement.test.cjs
          node experiments/project-ace/cutover-ownership.test.cjs
          node experiments/project-ace/cutover-ownership-db.test.cjs
          node experiments/project-ace/cutover-settlement-db.test.cjs
          node experiments/project-ace/cutover-medical-db.test.cjs
          node experiments/project-ace/cutover-admission-db.test.cjs
          node experiments/project-ace/cutover-guest-db.test.cjs
          node experiments/project-ace/cutover-surrender-db.test.cjs
          node experiments/project-ace/cancellation-refund-review.test.cjs
          node experiments/project-ace/cutover-cancellation-db.test.cjs
          node experiments/project-ace/cutover-special-closure-db.test.cjs
          node experiments/project-ace/cutover-reconciliation-db.test.cjs
          node experiments/project-ace/cutover-drain-db.test.cjs
          node experiments/project-ace/cutover-identity-db.test.cjs
          node experiments/project-ace/cutover-source-transaction-db.test.cjs
          node experiments/project-ace/cutover-source-resources-db.test.cjs
          node experiments/project-ace/cutover-source-career-db.test.cjs
          node experiments/project-ace/cutover-integrated-tournament-db.test.cjs
          node experiments/project-ace/cutover-source-exceptions-db.test.cjs
          node experiments/project-ace/cutover-source-void-db.test.cjs
          node experiments/project-ace/cutover-source-qualification-db.test.cjs
          node experiments/project-ace/cutover-source-qualification-exceptions-db.test.cjs
          node experiments/project-ace/cutover-pilot-preflight-db.test.cjs
          node experiments/project-ace/cutover-pilot-control-db.test.cjs
      - name: Isolated follow-up persistence experiment
        env:
          PGPASSWORD: ace-disposable-admin
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -f experiments/project-ace/followup-persistence-review.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -f experiments/project-ace/followup-persistence-test.sql
          node -e 'const s=require("node:fs").readFileSync("experiments/project-ace/schedule-projection-review.sql","utf8");if(s.split(/\r?\n/).some(l=>l.endsWith(" AS "+String.fromCharCode(36))||l==="END "+String.fromCharCode(36)+";"))throw Error("Invalid SQL dollar delimiter")'
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -f experiments/project-ace/schedule-projection-review.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -f experiments/project-ace/schedule-projection-smoke.sql
          ACE_REVIEW_DB=1 ACE_REVIEW_DB_PASSWORD=ace-disposable-worker ACE_REVIEW_DB_PORT=55432 node experiments/project-ace/schedule-projection-db.test.cjs
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -f experiments/project-ace/followup-worker-recovery-test.sql
          ACE_FOLLOWUP_REVIEW=disposable-ci-only ACE_REVIEW_DB=1 ACE_REVIEW_DB_PASSWORD=ace-disposable-worker ACE_REVIEW_DB_PORT=55432 node experiments/project-ace/followup-poller-db.test.cjs
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -f experiments/project-ace/schedule-projection-restore.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review -c 'DROP TABLE ace_cutover_review.followup_attempts,ace_cutover_review.followup_jobs; DROP FUNCTION ace_cutover_review.stage_followup(text,text,bigint),ace_cutover_review.note_followup_attempt(text,text,text,text);'
      - name: Network-isolated legacy capture SQL rehearsal
        env:
          ACE_SHADOW_SQL_REHEARSAL: disposable-ci-only
        run: bash experiments/project-ace/legacy-shadow-sql-ci.sh
      - name: Build isolated browser and install pinned Chromium driver
        run: |
          npm ci --ignore-scripts
          node scripts/build-ace-pilot.mjs
          npm install --prefix "$RUNNER_TEMP/ace-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/ace-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real Chromium isolated acceptance
        env:
          ACE_REVIEW_DB: '1'
          ACE_REVIEW_DB_PASSWORD: ace-disposable-worker
          ACE_REVIEW_DB_PORT: '55432'
        run: NODE_PATH="$RUNNER_TEMP/ace-browser/node_modules" node experiments/project-ace/browser-acceptance.test.cjs
      - name: Disposable database backup and isolated recovery rehearsal
        env:
          ACE_MIGRATION_REHEARSAL: disposable-ci-only
          ACE_REVIEW_CONTAINER: ${{ job.services.postgres.id }}
        run: bash experiments/project-ace/recovery-rehearsal.sh
      - name: Read-only restored catalog negative control
        env:
          PGPASSWORD: ace-disposable-admin
        run: |
          psql -X -qAt -v ON_ERROR_STOP=1 -h 127.0.0.1 -p 55432 -U postgres -d ace_review_recovery -f experiments/project-ace/capture-restored-schema.sql > "$RUNNER_TEMP/ace-catalog.json"
          node experiments/project-ace/restored-schema-gate.test.cjs "$RUNNER_TEMP/ace-catalog.json"
