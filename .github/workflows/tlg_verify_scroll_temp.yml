name: Verify tournament scroll fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tlg_verify_scroll_temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
