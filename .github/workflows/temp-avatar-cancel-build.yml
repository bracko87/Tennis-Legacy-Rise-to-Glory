name: Temporary Avatar Cancel Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-avatar-cancel-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
