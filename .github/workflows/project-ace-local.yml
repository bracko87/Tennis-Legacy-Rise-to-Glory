name: Ace local prototype verification
on:
  push:
    branches: [project-ace]
    paths:
      - 'experiments/project-ace/**'
      - '.github/workflows/project-ace-local.yml'
      - 'src/ace-pilot/**'
      - 'scripts/build-ace-pilot.mjs'
      - 'scripts/build.mjs'
      - 'src/App.tsx'
      - 'src/components/layout/GameSidebar.tsx'
      - 'src/lib/aceReviewFlag.ts'
      - 'src/pages/manager/AceReview.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Native Node tests (no production credentials)
        run: |
          node experiments/project-ace/engine.test.cjs
          node experiments/project-ace/match-service.test.cjs
          node experiments/project-ace/local-auth.test.cjs
          node experiments/project-ace/local-http.test.cjs
          node experiments/project-ace/offline.test.cjs
          node experiments/project-ace/experience.test.cjs
          node experiments/project-ace/multiplayer-profile.test.cjs
          node experiments/project-ace/pacing.test.cjs
          node experiments/project-ace/tactical-v2.test.cjs
          node experiments/project-ace/context.test.cjs
          node experiments/project-ace/calibrate-v05.cjs --verify
          node experiments/project-ace/legacy-bridge.test.cjs
          node experiments/project-ace/tournament-lifecycle.test.cjs
          node experiments/project-ace/tournament-draw.test.cjs
          node experiments/project-ace/tournament-http.test.cjs
          node experiments/project-ace/private-player.test.cjs
          node experiments/project-ace/world-integration.test.cjs
          node experiments/project-ace/multiplayer-draw.test.cjs
          node experiments/project-ace/career-support.test.cjs
          node experiments/project-ace/world-worker.test.cjs
          node experiments/project-ace/health-walkover.test.cjs
          node experiments/project-ace/health-lifecycle.test.cjs
          node experiments/project-ace/health-field-effects.test.cjs
          node experiments/project-ace/world-http.test.cjs
          node experiments/project-ace/official-review.test.cjs
          node experiments/project-ace/official-simulation-payload-review.test.cjs
          node experiments/project-ace/official-replay-adapter.test.cjs
          node experiments/project-ace/official-replay-engine.test.cjs
          node experiments/project-ace/world-security.test.cjs
          node experiments/project-ace/scheduler-stress.test.cjs
          node experiments/project-ace/restored-schema-gate.test.cjs
          node experiments/project-ace/capture-authentic-catalog.test.cjs
          node experiments/project-ace/compare-authentic-catalogs.test.cjs
          node experiments/project-ace/source-admission-review.test.cjs
          node experiments/project-ace/source-qualification-review.test.cjs
          node experiments/project-ace/source-career-proposal.test.cjs
          node experiments/project-ace/shadow-comparison.test.cjs
          node experiments/project-ace/shadow-cohort-review.test.cjs
          node experiments/project-ace/shadow-screening.test.cjs
          node experiments/project-ace/shadow-career-review.test.cjs
          node experiments/project-ace/ranking-defence-review.test.cjs
          node experiments/project-ace/integrated-career-acceptance.test.cjs
          node experiments/project-ace/legacy-shadow-capture.test.cjs
          node experiments/project-ace/authentic-shadow-evidence.test.cjs
          node experiments/project-ace/release-readiness-review.test.cjs
          node experiments/project-ace/migration-package-review.test.cjs
          node experiments/project-ace/legacy-tournament-adapter-review.test.cjs
          node experiments/project-ace/legacy-prematch-adapter-review.test.cjs
          node experiments/project-ace/legacy-prematch-effects-review.test.cjs
          node experiments/project-ace/tactical-v3-review.test.cjs
          node experiments/project-ace/legacy-eligibility-review.test.cjs
          node experiments/project-ace/current-legacy-source-pin.test.cjs
          node experiments/project-ace/operational-schedule.test.cjs
          node experiments/project-ace/followup-reconciliation.test.cjs
          node experiments/project-ace/followup-poller.test.cjs
          node --check experiments/project-ace/tournament.js
          node --check experiments/project-ace/ace.js
          node --check experiments/project-ace/start-local.cjs
      - name: Build isolated React interface
        run: |
          npm ci --ignore-scripts
          node scripts/build-ace-pilot.mjs
      - name: Verify actual app review build guard and compile
        run: |
          node experiments/project-ace/app-build-guard.test.cjs
          TL_ACE_REVIEW=1 TL_SUPABASE_URL=http://127.0.0.1:54321 TL_SUPABASE_PUBLISHABLE_KEY=sb_publishable_disposable_review node scripts/build.mjs --compile-local
