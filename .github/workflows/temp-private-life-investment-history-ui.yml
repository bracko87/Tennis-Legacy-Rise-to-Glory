name: Temp Private Life investment/history UI

on:
  push:
    paths:
      - '.github/workflows/temp-private-life-investment-history-ui.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch investment chart and asset history UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          investment = Path('src/components/private-life/PrivateLifeInvestments.tsx')
          s = investment.read_text()

          s = s.replace(
              "  refresh_cadence_game_minutes?: number | null\n",
              "  refresh_cadence_game_minutes?: number | null\n  refresh_cadence_real_minutes?: number | null\n",
          )

          old_time = r"""function gameTimeLabel(metadata?: QuoteMetadata | null) {
            const raw = finiteNumber(metadata?.game_last_change_total_seconds)
            if (raw === null || raw < 0) return 'Game time unavailable'
            const total = Math.floor(raw)
            const secondsPerDay = 86400
            const secondsPerSeason = 366 * secondsPerDay
            const season = Math.floor(total / secondsPerSeason) + 1
            let dayIndex = Math.floor((total % secondsPerSeason) / secondsPerDay)
            const secondOfDay = total % secondsPerDay
            let monthName = 'January'
            let day = 1
            for (const [name, days] of GAME_MONTHS) {
              if (dayIndex < days) {
                monthName = name
                day = dayIndex + 1
                break
              }
              dayIndex -= days
            }
            const hour = Math.floor(secondOfDay / 3600)
            const minute = Math.floor((secondOfDay % 3600) / 60)
            return `Season ${season} · ${monthName} ${day} · ${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`
          }"""
          old_time = re.sub(r'^          ', '', old_time, flags=re.M)
          new_time = """function gameTimeFromSeconds(value: unknown) {
            const raw = finiteNumber(value)
            if (raw === null || raw < 0) return 'Game time unavailable'
            const total = Math.floor(raw)
            const secondsPerDay = 86400
            const secondsPerSeason = 366 * secondsPerDay
            const season = Math.floor(total / secondsPerSeason) + 1
            let dayIndex = Math.floor((total % secondsPerSeason) / secondsPerDay)
            const secondOfDay = total % secondsPerDay
            let monthName = 'January'
            let day = 1
            for (const [name, days] of GAME_MONTHS) {
              if (dayIndex < days) {
                monthName = name
                day = dayIndex + 1
                break
              }
              dayIndex -= days
            }
            const hour = Math.floor(secondOfDay / 3600)
            const minute = Math.floor((secondOfDay % 3600) / 60)
            return `Season ${season} · ${monthName} ${day} · ${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`
          }

          function gameTimeLabel(metadata?: QuoteMetadata | null, mode: 'change' | 'checked' = 'change') {
            return gameTimeFromSeconds(mode === 'checked' ? metadata?.game_checked_total_seconds : metadata?.game_last_change_total_seconds)
          }"""
          new_time = re.sub(r'^          ', '', new_time, flags=re.M)
          if old_time not in s:
              raise SystemExit('gameTimeLabel block not found')
          s = s.replace(old_time, new_time)

          s = re.sub(
              r"function historyValues\(history\?: unknown\[\]\) \{.*?\n\}\n\nfunction Sparkline\(\{ history \}: \{ history\?: unknown\[\] \}\) \{.*?\n\}\n\nfunction MarketTrendPanel",
              """type ChartHistoryPoint = { price: number; gameSeconds: number | null }

function historyPoints(history?: unknown[]): ChartHistoryPoint[] {
  return (history ?? []).map((point) => {
    if (typeof point === 'number') {
      const price = finiteNumber(point)
      return price !== null && price > 0 ? { price, gameSeconds: null } : null
    }
    if (point && typeof point === 'object' && 'p' in point) {
      const raw = point as { p?: unknown; g?: unknown }
      const price = finiteNumber(raw.p)
      if (price === null || price <= 0) return null
      return { price, gameSeconds: finiteNumber(raw.g) }
    }
    return null
  }).filter((point): point is ChartHistoryPoint => point !== null)
}

function historyValues(history?: unknown[]) {
  return historyPoints(history).map((point) => point.price)
}

function Sparkline({ history, currency }: { history?: unknown[]; currency: string }) {
  const historyData = historyPoints(history)
  if (historyData.length < 2) return <div className=\"private-life-market-chart-empty\">Trend data will appear as market-price snapshots accumulate.</div>

  const width = 300
  const height = 82
  const padding = 5
  const values = historyData.map((point) => point.price)
  const min = Math.min(...values)
  const max = Math.max(...values)
  const spread = Math.max(max - min, Math.abs(max) * 0.002, 0.000001)
  const coordinates = historyData.map((point, index) => {
    const x = padding + (index / (historyData.length - 1)) * (width - padding * 2)
    const y = height - padding - ((point.price - min) / spread) * (height - padding * 2)
    return { x, y, point }
  })
  const positive = values[values.length - 1] >= values[0]

  return (
    <svg className={`private-life-market-sparkline ${positive ? 'positive' : 'negative'}`} viewBox={`0 0 ${width} ${height}`} role=\"img\" aria-label=\"Recent reference price trend. Move the mouse across points to see game dates and prices.\">
      <polyline points={coordinates.map(({ x, y }) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ')} fill=\"none\" vectorEffect=\"non-scaling-stroke\" />
      {coordinates.map(({ x, y, point }, index) => (
        <circle key={`${index}-${x}`} cx={x} cy={y} r=\"7\" fill=\"transparent\">
          <title>{`${gameTimeFromSeconds(point.gameSeconds)} · ${marketPrice(point.price, currency)}`}</title>
        </circle>
      ))}
    </svg>
  )
}

function MarketTrendPanel""",
              s,
              flags=re.S,
          )

          s = s.replace('<Sparkline history={chartHistory} />', '<Sparkline history={chartHistory} currency={currency} />')
          s = s.replace(
              """        <div><span>{instrument.asset_type === 'stock' ? 'Volume' : '24H volume'}</span><strong>{compactNumber(activity)}</strong></div>
        <div><span>Last price change (game time)</span><strong>{gameTimeLabel(instrument.quote_metadata)}</strong></div>""",
              """        <div><span>{instrument.asset_type === 'stock' ? 'Volume' : '24H volume'}</span><strong>{compactNumber(activity)}</strong></div>
        <div><span>Last checked (game time)</span><strong>{gameTimeLabel(instrument.quote_metadata, 'checked')}</strong></div>
        <div><span>Last price change (game time)</span><strong>{gameTimeLabel(instrument.quote_metadata)}</strong></div>
        <div><span>Automatic check cadence</span><strong>Every 15 real minutes</strong></div>""",
          )
          s = s.replace(
              'Reference prices are checked every 15 in-game minutes. Stocks only change when the external market provides a new price; crypto can change continuously.',
              'Reference prices are checked every 15 real-world minutes. All timestamps shown to players use Tennis Legacy game time. Stocks only change when the external market provides a new price; crypto can change continuously.',
          )
          s = s.replace(
              '<div className="private-life-market-update-note"><strong>Automatic market cache:</strong> prices are checked every 15 in-game minutes. Stocks can only change while their external market provides a new quote; crypto can move continuously 24/7. The time shown beside a price is Tennis Legacy game time, not real-world time.</div>',
              '<div className="private-life-market-update-note"><strong>Automatic market cache:</strong> prices are checked every 15 real-world minutes. Stocks can only change while their external market provides a new quote; crypto can move continuously 24/7. The displayed check/change timestamps are always Tennis Legacy game time.</div>',
          )
          s = s.replace('{gameTimeLabel(selectedInstrument.quote_metadata)}</span></div>', "{gameTimeLabel(selectedInstrument.quote_metadata, 'checked')}</span></div>")
          s = s.replace('<span>{gameTimeLabel(position.quote_metadata)}</span>', "<span>{gameTimeLabel(position.quote_metadata, 'checked')}</span>")

          investment.write_text(s)

          private_life = Path('src/pages/dashboard/PrivateLife.tsx')
          s = private_life.read_text()
          s = s.replace("import '../../styles/private-life-marketplace.css'\n", "import '../../styles/private-life-marketplace.css'\nimport '../../styles/private-life-history.css'\n")

          type_anchor = """type PrivateLifeDashboard = {
  player_id: string"""
          history_type = """type AssetHistoryRow = {
  id: string
  catalog_code: string
  category: AssetCategory
  name: string
  base_name: string
  acquisition_type: 'purchase' | 'starter_home'
  purchase_absolute_day: number
  purchase_price: number
  sold_absolute_day?: number | null
  sold_price?: number | null
  status: 'owned' | 'sold'
  city?: string | null
  country_code?: string | null
  country_name?: string | null
}

"""
          if history_type not in s:
              s = s.replace(type_anchor, history_type + type_anchor)

          helper_anchor = """function matchesPriceBand(price: number, band: MarketplacePrice) {"""
          game_day_helper = """function gameDayLabel(absoluteDay: number | null | undefined) {
  const raw = Number(absoluteDay)
  if (!Number.isFinite(raw) || raw < 0) return 'Game date unavailable'
  const totalDays = Math.floor(raw)
  const season = Math.floor(totalDays / 366) + 1
  let dayIndex = totalDays % 366
  let monthName = 'January'
  let day = 1
  for (const [name, days] of GAME_MONTHS) {
    if (dayIndex < days) {
      monthName = name
      day = dayIndex + 1
      break
    }
    dayIndex -= days
  }
  return `Season ${season} · ${monthName} ${day}`
}

"""
          if 'function gameDayLabel(' not in s:
              months_anchor = """const SALE_META: Record<SaleMode, { label: string; detail: string }> = {"""
              months_def = """const GAME_MONTHS = [
  ['January', 31], ['February', 29], ['March', 31], ['April', 30],
  ['May', 31], ['June', 30], ['July', 31], ['August', 31],
  ['September', 30], ['October', 31], ['November', 30], ['December', 31],
] as const

"""
              s = s.replace(months_anchor, months_def + months_anchor)
              s = s.replace(helper_anchor, game_day_helper + helper_anchor)

          state_anchor = """  const [propertyLocationCode, setPropertyLocationCode] = useState('')
"""
          state_add = """  const [assetHistory, setAssetHistory] = useState<AssetHistoryRow[]>([])
  const [showAssetHistory, setShowAssetHistory] = useState(false)
  const [assetHistoryLoading, setAssetHistoryLoading] = useState(false)
  const [assetHistoryError, setAssetHistoryError] = useState<string | null>(null)
"""
          if 'const [assetHistory, setAssetHistory]' not in s:
              s = s.replace(state_anchor, state_anchor + state_add)

          fn_anchor = """  async function cancelSale(listingId: string) {"""
          history_fn = """  async function toggleAssetHistory() {
    if (showAssetHistory) {
      setShowAssetHistory(false)
      return
    }
    setShowAssetHistory(true)
    if (assetHistory.length > 0) return
    setAssetHistoryLoading(true)
    setAssetHistoryError(null)
    const { data, error: rpcError } = await supabase.rpc('get_private_life_asset_history_v1')
    if (rpcError) setAssetHistoryError(rpcError.message)
    else setAssetHistory(Array.isArray(data) ? data as unknown as AssetHistoryRow[] : [])
    setAssetHistoryLoading(false)
  }

"""
          if 'async function toggleAssetHistory()' not in s:
              s = s.replace(fn_anchor, history_fn + fn_anchor)

          old_collection_head = """            <div className=\"private-life-section-head\"><div><div className=\"private-life-section-eyebrow\">Collection</div><h3>My physical assets</h3><p>Track current value, prestige points, monthly ownership costs and choose how quickly you want to sell each possession.</p></div></div>
            <CategoryFilters value={filter} onChange={setFilter} />"""
          new_collection_head = """            <div className=\"private-life-section-head\"><div><div className=\"private-life-section-eyebrow\">Collection</div><h3>My physical assets</h3><p>Track current value, prestige points, monthly ownership costs and choose how quickly you want to sell each possession.</p></div><button type=\"button\" className=\"private-life-refresh\" onClick={() => void toggleAssetHistory()}>{showAssetHistory ? 'Hide history' : 'Asset history'}</button></div>
            <CategoryFilters value={filter} onChange={setFilter} />
            {showAssetHistory ? (
              <div className=\"private-life-asset-history\">
                <div className=\"private-life-asset-history-head\"><div><strong>Asset history</strong><span>Every physical asset assigned, purchased or sold in your career.</span></div></div>
                {assetHistoryLoading ? <div className=\"private-life-asset-history-state\">Loading asset history…</div> : assetHistoryError ? <div className=\"private-life-asset-history-state error\">{assetHistoryError}</div> : assetHistory.length === 0 ? <div className=\"private-life-asset-history-state\">No asset history yet.</div> : (
                  <div className=\"private-life-asset-history-table-wrap\"><table className=\"private-life-asset-history-table\"><thead><tr><th>Asset</th><th>Acquired</th><th>Price / value</th><th>Status</th></tr></thead><tbody>{assetHistory.map((row) => <tr key={row.id}><td><strong>{row.name}</strong><span>{categoryLabel(row.category)}</span></td><td><strong>{row.acquisition_type === 'starter_home' ? 'Starting home' : gameDayLabel(row.purchase_absolute_day)}</strong>{row.acquisition_type === 'starter_home' ? <span>{gameDayLabel(row.purchase_absolute_day)}</span> : null}</td><td><strong>{money(row.purchase_price, currency)}</strong><span>{row.acquisition_type === 'starter_home' ? 'Assigned starting value' : 'Purchase price'}</span></td><td>{row.status === 'sold' ? <><strong className=\"private-life-trend-negative\">Sold</strong><span>{gameDayLabel(row.sold_absolute_day)} · {money(Number(row.sold_price ?? 0), currency)}</span></> : <><strong className=\"private-life-trend-positive\">Owned</strong><span>Currently in collection</span></>}</td></tr>)}</tbody></table></div>
                )}
              </div>
            ) : null}"""
          if old_collection_head not in s:
              raise SystemExit('Collection header block not found')
          s = s.replace(old_collection_head, new_collection_head)
          private_life.write_text(s)

          Path('src/styles/private-life-history.css').write_text(""".private-life-asset-history {
  margin-top: 14px;
  border: 1px solid #d7e1ec;
  border-radius: 14px;
  background: #fff;
  overflow: hidden;
}

.private-life-asset-history-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 18px;
  border-bottom: 1px solid #e4ebf2;
}

.private-life-asset-history-head strong { display: block; color: #102a43; font-size: 15px; }
.private-life-asset-history-head span { display: block; margin-top: 4px; color: #6b7f95; font-size: 12px; }
.private-life-asset-history-table-wrap { overflow-x: auto; }
.private-life-asset-history-table { width: 100%; border-collapse: collapse; min-width: 720px; }
.private-life-asset-history-table th { padding: 10px 14px; background: #f6f9fc; color: #71849a; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; text-align: left; }
.private-life-asset-history-table td { padding: 12px 14px; border-top: 1px solid #e8eef4; vertical-align: top; color: #17324d; font-size: 12px; }
.private-life-asset-history-table td strong { display: block; font-size: 12px; }
.private-life-asset-history-table td span { display: block; margin-top: 3px; color: #7890a8; font-size: 11px; }
.private-life-asset-history-state { padding: 18px; color: #6b7f95; font-size: 12px; }
.private-life-asset-history-state.error { color: #b42318; }

@media (max-width: 720px) {
  .private-life-asset-history-head { align-items: flex-start; }
}
""")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/private-life/PrivateLifeInvestments.tsx src/pages/dashboard/PrivateLife.tsx src/styles/private-life-history.css
          git diff --cached --quiet && exit 0
          git commit -m "Improve investment timing visibility and asset history"
          git push origin main
