name: Temporary avatar UUID compatibility verifier

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tlg_avatar_uuid_runtime_fix_v2_temp.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply compatibility patch
        run: node .github/scripts/fix-avatar-request-uuid.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified fix
        run: |
          git config user.name "bracko87"
          git config user.email "aleksandarlevnajic@gmail.com"
          git add src/components/player/AvatarReplacementRequestPanel.tsx
          git rm .github/scripts/fix-avatar-request-uuid.mjs
          git rm .github/workflows/tlg_avatar_uuid_runtime_fix_v2_temp.yml
          git commit -m "Fix avatar request UUID generation compatibility"
          git push origin main
