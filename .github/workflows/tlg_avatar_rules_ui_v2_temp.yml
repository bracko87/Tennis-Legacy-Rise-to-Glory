name: Temporary avatar rules UI verifier v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tlg_avatar_rules_ui_v2_temp.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patch
        run: python .github/scripts/tlg_avatar_rules_patch_temp.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "bracko87"
          git config user.email "aleksandarlevnajic@gmail.com"
          git add src/components/player/AvatarReplacementRequestPanel.tsx src/styles/avatar-replacement-request.css docs/avatar-replacement-admin-workflow.md
          git rm .github/scripts/tlg_avatar_rules_patch_temp.py .github/workflows/tlg_avatar_rules_ui_v2_temp.yml
          git commit -m "Add avatar rules consent and privacy guidance"
          git push origin main
