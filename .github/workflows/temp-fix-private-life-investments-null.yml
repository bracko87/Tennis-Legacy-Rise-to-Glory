name: Temporary fix Private Life investments null crash

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch null-safe investment dashboard rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/private-life/PrivateLifeInvestments.tsx')
          text = path.read_text()

          old = """    const next = data as unknown as InvestmentDashboard
    setDashboard(next)
    return next
"""
          new = """    const raw = data as unknown as InvestmentDashboard
    const next: InvestmentDashboard = {
      ...raw,
      positions: Array.isArray(raw.positions) ? raw.positions : [],
      instruments: Array.isArray(raw.instruments) ? raw.instruments : [],
      trades: Array.isArray(raw.trades) ? raw.trades : [],
    }
    setDashboard(next)
    return next
"""
          if old not in text:
              raise SystemExit('Dashboard normalization target not found')
          text = text.replace(old, new, 1)

          old = """  const portfolioValuePrecise = dashboard.positions.reduce((sum, position) => sum + Number(position.market_value_precise ?? position.market_value ?? 0), 0)
  const unrealizedPrecise = dashboard.positions.reduce((sum, position) => sum + Number(position.unrealized_pnl_precise ?? position.unrealized_pnl ?? 0), 0)
"""
          new = """  const safePositions = dashboard?.positions ?? []
  const portfolioValuePrecise = safePositions.reduce((sum, position) => sum + Number(position.market_value_precise ?? position.market_value ?? 0), 0)
  const unrealizedPrecise = safePositions.reduce((sum, position) => sum + Number(position.unrealized_pnl_precise ?? position.unrealized_pnl ?? 0), 0)
"""
          if old not in text:
              raise SystemExit('Initial-render portfolio target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/private-life/PrivateLifeInvestments.tsx
          git commit -m "Fix Private Life investments initial render crash"
          git push origin main
