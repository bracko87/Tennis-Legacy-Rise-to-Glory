name: Validate Tennis Preferences

# The release validation workflow runs these checks on each release.
# Keep this specialist workflow for explicit troubleshooting only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennis-preferences-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Preferences translations
        run: npm run check:preferences
      - name: Validate Portuguese source parity
        run: npm run check:pt
      - name: Compile production bundle
        run: npm run build
