name: Validate racquet names v2

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20260916134000_refine_racquet_model_names_v2.sql'
      - '.github/workflows/validate-racquet-names-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
