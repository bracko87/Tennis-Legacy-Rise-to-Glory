name: Helios real Auth and identity conversion integration

on:
  pull_request:
    paths:
      - 'scripts/prepare-helios-real-auth-ci.mjs'
      - 'scripts/helios-guest-browser-ci.mjs'
      - 'tests/browser/helios-guest-harness.tsx'
      - 'src/auth/AuthContext.tsx'
      - 'src/pages/auth/TryAsGuest.tsx'
      - 'src/pages/auth/GuestRegistration.tsx'
      - 'scripts/helios-local-guest-auth-acceptance.mjs'
      - 'tests/fixtures/helios_real_auth*.sql'
      - 'tests/fixtures/helios_guest_deleted_identity_guard_candidate.sql'
      - 'tests/fixtures/helios_guest_retirement_*.sql'
      - 'tests/fixtures/helios_guest_core_erasure_candidate.sql'
      - 'tests/fixtures/helios_guest_production_release_candidate.sql'
      - 'tests/fixtures/helios_guest_history_owner_candidate.sql'
      - '.github/workflows/helios-real-auth-integration.yml'
      - 'supabase/migrations/*helios*guest*.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-auth-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - name: Install locked application dependencies
        run: npm ci
      - name: Create isolated fixture with real guest SQL
        run: node scripts/prepare-helios-real-auth-ci.mjs
      - name: Start disposable local Supabase (no project linking)
        working-directory: .helios-guest-sandbox
        run: |
          supabase start --help
          supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor >/tmp/helios-start.log 2>&1 || { tail -n 20 /tmp/helios-start.log | sed -E 's/(eyJ[a-zA-Z0-9._-]+|sb_(secret|publishable)_[a-zA-Z0-9_-]+)/[redacted]/g'; exit 1; }
      - name: Exercise actual anonymous Auth, trial and email confirmation
        env:
          HELIOS_CI_LOCAL_CLI: '1'
          HELIOS_CI_CAREER: '1'
          HELIOS_CI_ERASURE: '1'
        run: npm run test:helios-guest-local
      - name: Install pinned isolated browser test tool
        run: |
          npm install --prefix /tmp/helios-browser-tools --no-audit --no-fund --save-exact playwright@1.56.1
          /tmp/helios-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise real guest frontend in Chromium
        run: node scripts/helios-guest-browser-ci.mjs
      - name: Stop disposable local containers
        if: always()
        working-directory: .helios-guest-sandbox
        run: supabase stop --no-backup
