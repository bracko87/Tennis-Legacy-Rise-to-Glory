name: Temporary tournament entry UI verifier

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tlg_tournament_entry_ui_temp.yml
      - .github/scripts/patch_tournament_entry_ui.py

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch tournament entry UX
        run: python .github/scripts/patch_tournament_entry_ui.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified implementation and remove temporary files
        run: |
          git config user.name "bracko87"
          git config user.email "aleksandarlevnajic@gmail.com"
          git add src/components/tournament/TournamentExperienceEnhancements.tsx src/components/tournament/TournamentDefendingPoints.tsx src/styles/tournament-experience-enhancements.css src/styles/tournament-defending-points.css
          git rm .github/workflows/tlg_tournament_entry_ui_temp.yml .github/scripts/patch_tournament_entry_ui.py
          git commit -m "Improve tournament application field UX"
          git push origin main
