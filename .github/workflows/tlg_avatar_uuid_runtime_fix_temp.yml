name: Temporary avatar UUID runtime fix verifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tlg_avatar_uuid_runtime_fix_temp.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch UUID generation for older browsers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/player/AvatarReplacementRequestPanel.tsx')
          text = p.read_text()

          marker = """async function validateImage(file: File) {
  if (file.size <= 0) throw new Error('Please choose a valid image file.')
"""
          helper = """function createSecureRequestId() {
  const cryptoApi = globalThis.crypto
  if (!cryptoApi) throw new Error('Secure random number generation is not supported by this browser.')

  if (typeof cryptoApi.randomUUID === 'function') return cryptoApi.randomUUID()
  if (typeof cryptoApi.getRandomValues !== 'function') {
    throw new Error('Secure random number generation is not supported by this browser.')
  }

  const bytes = cryptoApi.getRandomValues(new Uint8Array(16))
  bytes[6] = (bytes[6] & 0x0f) | 0x40
  bytes[8] = (bytes[8] & 0x3f) | 0x80
  const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0'))
  return `${hex.slice(0, 4).join('')}-${hex.slice(4, 6).join('')}-${hex.slice(6, 8).join('')}-${hex.slice(8, 10).join('')}-${hex.slice(10, 16).join('')}`
}

async function validateImage(file: File) {
  if (file.size <= 0) throw new Error('Please choose a valid image file.')
"""
          if marker not in text:
              raise SystemExit('validateImage marker not found')
          text = text.replace(marker, helper, 1)

          old = '      const requestId = crypto.randomUUID()\n'
          new = '      const requestId = createSecureRequestId()\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one crypto.randomUUID call, found {text.count(old)}')
          text = text.replace(old, new, 1)

          p.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "bracko87"
          git config user.email "aleksandarlevnajic@gmail.com"
          git add src/components/player/AvatarReplacementRequestPanel.tsx
          git rm .github/workflows/tlg_avatar_uuid_runtime_fix_temp.yml
          git commit -m "Fix avatar request UUID generation compatibility"
          git push origin main
