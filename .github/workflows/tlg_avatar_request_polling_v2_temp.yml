name: Temporary avatar status polling verifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tlg_avatar_request_polling_v2_temp.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch private request status refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/player/AvatarReplacementRequestPanel.tsx')
          text = p.read_text()
          start_marker = "  useEffect(() => {\n    void loadRequest()\n    if (!user?.id) return\n\n    const channel = supabase"
          end_marker = "  }, [loadRequest, user?.id])\n"
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('Realtime request-status effect not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('Request-status effect end not found')
          end += len(end_marker)
          replacement = "\n".join([
              "  useEffect(() => {",
              "    void loadRequest()",
              "    if (!user?.id) return",
              "",
              "    const timer = window.setInterval(() => {",
              "      void loadRequest()",
              "    }, 30000)",
              "",
              "    return () => window.clearInterval(timer)",
              "  }, [loadRequest, user?.id])",
              "",
          ])
          p.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit verified implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "bracko87"
          git config user.email "aleksandarlevnajic@gmail.com"
          git add src/components/player/AvatarReplacementRequestPanel.tsx
          git rm .github/workflows/tlg_avatar_request_polling_v2_temp.yml
          git commit -m "Refresh private avatar request status safely"
          git push origin main
